
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redefinir Senha - Cachetão Pro</title>

<link rel="stylesheet" href="./css/reset.css">
<link rel="stylesheet" href="./css/layout.css">

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 18px;
  box-sizing: border-box;
  color: #fff;
}

.auth-card {
  width: min(440px, 94vw);
  padding: 34px 28px;
  border-radius: 22px;
  background: linear-gradient(180deg, #06391f, #032514);
  border: 1px solid rgba(212,175,55,.38);
  box-shadow:
    inset 0 1px rgba(255,255,255,.08),
    0 16px 36px rgba(0,0,0,.35);
}

.auth-card h1 {
  margin: 0 0 6px;
  text-align: center;
  font-size: 34px;
  font-weight: 900;
  color: #ffd86b;
  text-shadow: 0 3px 8px rgba(0,0,0,.45);
}

.auth-subtitle {
  margin-bottom: 24px;
  text-align: center;
  color: #fff;
  opacity: .88;
  font-size: 15px;
}

.auth-card input {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 14px;
  padding: 13px 14px;
  border-radius: 14px;
  border: 1px solid rgba(212,175,55,.22);
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 15px;
}

.auth-card input:focus {
  outline: none;
  border-color: #d4af37;
  background: rgba(255,255,255,.12);
  box-shadow: 0 0 0 3px rgba(212,175,55,.18);
}

.auth-card input::placeholder {
  color: rgba(255,255,255,.65);
}

.auth-actions {
  display: grid;
  gap: 12px;
}

button {
  padding: 13px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  transition: .12s;
}

.primary {
  background: linear-gradient(180deg, #a51f36, #731726);
  color: #fff;
  border: 1px solid rgba(212,175,55,.30);
  box-shadow: 0 8px 18px rgba(0,0,0,.22);
}

.primary:hover {
  background: linear-gradient(180deg, #bc2942, #8d1d31);
}

.secondary {
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.16);
  color: #fff;
}

.secondary:hover {
  background: rgba(255,255,255,.16);
}

.auth-message {
  min-height: 22px;
  margin-top: 16px;
  text-align: center;
  color: #ffd86b;
  font-weight: 700;
  line-height: 1.5;
}

.auth-links {
  margin-top: 20px;
  text-align: center;
  font-size: 15px;
}

.auth-links a {
  color: #ffd86b;
  font-weight: 900;
  text-decoration: none;
}

.auth-links a:hover {
  text-decoration: underline;
}

@media (max-width: 600px) {
  .auth-card {
    padding: 28px 20px;
  }

  .auth-card h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<div class="auth-card">

  <h1>♠ Nova Senha ♠</h1>

  <div class="auth-subtitle">
    Defina uma nova senha para sua conta no Cachetão Pro.
  </div>

  <input
    type="password"
    id="newPassword"
    placeholder="Nova senha"
    autocomplete="new-password"
  >

  <input
    type="password"
    id="confirmPassword"
    placeholder="Confirmar nova senha"
    autocomplete="new-password"
  >

  <div class="auth-actions">

    <button
      id="btnResetPassword"
      class="primary"
      type="button">
      Redefinir senha
    </button>

    <button
      id="btnBackLogin"
      class="secondary"
      type="button"
      onclick="window.location.href='./login.html'">
      Voltar
    </button>

  </div>

  <div id="authMessage" class="auth-message"></div>

  <div class="auth-links">
    <a href="./login.html">Ir para o Login</a>
  </div>

</div>

<script src="./js/reset-password.js"></script>

</body>
</html>
